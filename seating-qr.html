<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Your Seat — 16×20 poster</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Herr+Von+Muellerhoff&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ───────────────────────────────────────────────────────────
       16 × 20 inch welcome-desk poster — white with black type.
       Print: File → Print (or "Save as PDF"), paper size 16 × 20 in
       (portrait), margins "None". Laid out in inches so it prints at
       exact size; scaled to fit the window on screen for previewing.
       ─────────────────────────────────────────────────────────── */
    @page { size: 16in 20in; margin: 0; }

    :root {
      --ink: #111111;
      --ink-soft: #444444;
      --line: #1a1a1a;
      --serif: "Cormorant Garamond", Georgia, serif;
      --names: "Mrs Saint Delafield", "Herr Von Muellerhoff", "Brush Script MT", "Segoe Script", cursive;
      --sans: "Jost", "Segoe UI", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #e9e9e6; }
    body { font-family: var(--sans); overflow-x: hidden; }

    .stage { position: relative; margin: 1rem 0 6rem; }

    .poster {
      position: relative; width: 16in; height: 20in; overflow: hidden;
      color: var(--ink); background: #fff;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
      display: grid; grid-template-rows: 1fr auto 1fr; grid-template-columns: minmax(0, 1fr);
      align-items: center; justify-items: center; text-align: center; padding: 1.1in 1.3in;
    }
    /* a fine double frame: one hairline, one slightly heavier, both black */
    .frame { position: absolute; inset: 0.55in; pointer-events: none; border: 0.025in solid var(--line); }
    .frame::after { content: ""; position: absolute; inset: 0.12in; border: 0.01in solid var(--line); }
    /* small corner marks inside the frame */
    .corner { position: absolute; width: 0.7in; height: 0.7in; pointer-events: none; }
    .corner::before, .corner::after { content: ""; position: absolute; background: var(--line); }
    .corner::before { width: 100%; height: 0.012in; }
    .corner::after { width: 0.012in; height: 100%; }
    .corner.tl { top: 0.95in; left: 0.95in; }
    .corner.tr { top: 0.95in; right: 0.95in; transform: scaleX(-1); }
    .corner.bl { bottom: 0.95in; left: 0.95in; transform: scaleY(-1); }
    .corner.br { bottom: 0.95in; right: 0.95in; transform: scale(-1); }

    .top, .middle, .bottom { position: relative; width: 100%; }

    /* ── top: the names, biggest thing on the page ── */
    .eyebrow { font-weight: 400; font-size: 0.32in; letter-spacing: 0.4em; text-transform: uppercase; color: var(--ink-soft); }
    .names {
      font-family: var(--names); font-weight: 400; font-size: 2.6in; line-height: 1.05;
      margin: 0.05in 0 0.15in; color: var(--ink);
      display: flex; flex-direction: column; align-items: center;
    }
    .names span { display: block; white-space: nowrap; }
    .names .amp { font-family: var(--serif); font-style: italic; font-size: 0.26em; line-height: 1.5; color: var(--ink-soft); }
    .rule { display: flex; align-items: center; gap: 0.3in; width: 5in; margin: 0 auto; }
    .rule::before, .rule::after { content: ""; flex: 1; height: 0.012in; background: var(--line); }
    .rule span { width: 0.14in; height: 0.14in; border: 0.012in solid var(--line); transform: rotate(45deg); }
    .date { font-family: var(--serif); font-weight: 500; font-size: 0.42in; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin-top: 0.45in; }

    /* ── middle: the QR, centred on the page ── */
    .qr { display: inline-block; background: #fff; padding: 0.35in; border: 0.02in solid var(--line); }
    .qr img { width: 6.5in; height: 6.5in; display: block; }

    /* ── bottom: what to do ── */
    .title { font-family: var(--serif); font-weight: 500; font-size: 1.05in; line-height: 1.05; letter-spacing: 0.06em; color: var(--ink); }
    .sub { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 0.52in; color: var(--ink-soft); margin-top: 0.15in; }
    .steps { display: flex; justify-content: center; gap: 1in; margin-top: 0.45in; font-weight: 400; font-size: 0.3in; letter-spacing: 0.06em; color: var(--ink); }
    .steps span { display: flex; align-items: center; gap: 0.16in; }
    .steps b {
      font-weight: 400; display: grid; place-items: center; width: 0.48in; height: 0.48in; border-radius: 50%;
      border: 0.015in solid var(--line); color: var(--ink); font-size: 0.26in;
    }
    .url { font-weight: 400; font-size: 0.34in; letter-spacing: 0.08em; color: var(--ink-soft); margin-top: 0.4in; }
    .url a { color: inherit; text-decoration: none; }

    /* on-screen only */
    .toolbar {
      position: fixed; bottom: 1rem; left: 0; right: 0; text-align: center; z-index: 5;
      font-size: 0.85rem; color: var(--ink-soft);
    }
    .toolbar button { font: inherit; padding: 0.55rem 1.3rem; border-radius: 999px; border: 1px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; }
    .toolbar p { margin-top: 0.4rem; opacity: 0.85; }

    @media print {
      html, body { background: #fff; margin: 0; }
      .stage { transform: none !important; margin: 0; width: 16in !important; height: 20in !important; }
      .toolbar { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="poster">
      <div class="frame" aria-hidden="true"></div>
      <span class="corner tl" aria-hidden="true"></span><span class="corner tr" aria-hidden="true"></span>
      <span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>

      <div class="top">
        <p class="eyebrow">Welcome to the engagement of</p>
        <p class="names" id="names"><span>Mannat</span><span class="amp">&amp;</span><span>Sree</span></p>
        <div class="rule" aria-hidden="true"><span></span></div>
      </div>

      <div class="middle">
        <div class="qr">
          <img src="assets/seating-qr-black.svg" alt="QR code linking to the seating chart" />
        </div>
      </div>

      <div class="bottom">
        <h1 class="title">Find Your Seat</h1>
        <p class="sub">Scan the code with your phone camera to find your table</p>
        <div class="steps" aria-hidden="true">
          <span><b>1</b> Open your camera</span>
          <span><b>2</b> Point it at the code</span>
          <span><b>3</b> Tap the link</span>
        </div>
        <p class="url"><a href="/seating">click-here-for-rsvp.vercel.app/seating</a></p>
        <p class="date">Sunday, September 20, 2026</p>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button onclick="window.print()">🖨 Print / Save as PDF</button>
    <p>Set paper size to 16 × 20 in and margins to None.</p>
  </div>

  <script>
    (function () {
      const stage = document.getElementById("stage");
      const W = 16 * 96, H = 20 * 96;
      // Scale the poster down to fit the window for previewing.
      function fit() {
        const s = Math.min(1, (window.innerWidth - 24) / W, (window.innerHeight - 110) / H);
        stage.style.transformOrigin = "top left";
        stage.style.transform = "translateX(" + (window.innerWidth - W * s) / 2 + "px) scale(" + s + ")";
        stage.style.width = W + "px";
        stage.style.height = H * s + "px";
      }
      // Keep the names inside the top third whatever font renders them:
      // shrink until the top block fits above the centred QR and each
      // name fits the page width. Everything is measured through the
      // preview transform, so the numbers stay comparable.
      function fitNames() {
        const el = document.getElementById("names");
        const top = el.parentElement, poster = document.querySelector(".poster"), qr = document.querySelector(".qr");
        const pad = parseFloat(getComputedStyle(poster).paddingTop);
        const scale = poster.getBoundingClientRect().width / poster.offsetWidth;
        const maxW = top.getBoundingClientRect().width;
        // leave at least 0.4in of air between the names block and the code
        const maxH = (poster.getBoundingClientRect().height - qr.getBoundingClientRect().height) / 2 - (pad + 0.4 * 96) * scale;
        const tooBig = () => {
          const w = Math.max(...[...el.children].map((c) => c.getBoundingClientRect().width));
          return w > maxW || top.getBoundingClientRect().height > maxH;
        };
        let size = 2.6 * 96;
        el.style.fontSize = size + "px";
        while (tooBig() && size > 96) { size -= 4; el.style.fontSize = size + "px"; }
      }
      fit(); fitNames();
      window.addEventListener("resize", fit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames);
      window.addEventListener("beforeprint", fitNames);
    })();
  </script>
</body>
</html>
